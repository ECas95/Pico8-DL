name: SEVEN'S CODE snapshot fast search

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sevens-code-snapshot-fast.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Run exact searches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result/raw
          python3 - <<'PY'
          import concurrent.futures,json,os,pathlib,re,time,urllib.parse,urllib.request
          O=pathlib.Path('result'); R=O/'raw'; UA='Mozilla/5.0 SEVENS-CODE-preservation'
          qs=[
            '"jp.co.applibot.ghmabgzaxkx"','"octocacheevai"','"files/octo/pdb/1/102"','"octo.abot.sh"',
            '"SEVEN\'S CODE" "Data.vhdx"','"SEVEN\'S CODE" "userdata-qemu.img"','"SEVEN\'S CODE" vmdk',
            '"SEVEN\'S CODE" vdi','"SEVEN\'S CODE" qcow2','"SEVEN\'S CODE" BlueStacks',
            '"SEVEN\'S CODE" Nox','"SEVEN\'S CODE" LDPlayer','"SEVEN\'S CODE" MuMu',
            'セブンスコード エミュレータ バックアップ','セブンスコード 端末 データ 保存',
            '"SEVEN\'S CODE" 模拟器 备份','"SEVEN\'S CODE" 数据包 存档',
            'site:drive.google.com "SEVEN\'S CODE"','site:mega.nz "SEVEN\'S CODE"','site:pan.baidu.com "SEVEN\'S CODE"'
          ]
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
            with urllib.request.urlopen(req,timeout=45) as x:return x.read()
          urls={}
          for i,q in enumerate(qs):
            e=urllib.parse.quote_plus(q)
            urls[f'bing_{i}.xml']=f'https://www.bing.com/search?format=rss&q={e}'
            urls[f'ddg_{i}.html']=f'https://html.duckduckgo.com/html/?q={e}'
            urls[f'google_{i}.txt']=f'https://r.jina.ai/http://www.google.com/search?q={e}'
          for i,q in enumerate(['SEVEN\'S CODE','SEVENS CODE','セブンスコード','jp.co.applibot.ghmabgzaxkx','octocacheevai','octo.abot.sh']):
            p=urllib.parse.urlencode({'q':f'"{q}"','fl[]':'identifier,title,description,subject,creator,mediatype,downloads','rows':200,'page':1,'output':'json'})
            urls[f'ia_{i}.json']='https://archive.org/advancedsearch.php?'+p
          def f(x):
            n,u=x
            try:d=get(u);(R/n).write_bytes(d);return {'name':n,'url':u,'bytes':len(d)}
            except Exception as e:(R/(n+'.error')).write_text(str(e));return {'name':n,'url':u,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:inv=list(ex.map(f,urls.items()))
          ia=[]
          for p in R.glob('ia_*.json'):
            try:ia+=json.loads(p.read_text(errors='replace')).get('response',{}).get('docs',[])
            except:pass
          unique={d.get('identifier'):d for d in ia if d.get('identifier')}
          key=re.compile(r'(?i)(seven.?s.?code|セブンスコード|jp\.co\.applibot\.ghmabgzaxkx|octocacheevai|files/octo|data\.vhdx|userdata-qemu\.img|\.vmdk|\.vdi|\.qcow2|bluestacks|bignox|ldplayer|mumu)')
          evidence=[]
          for p in R.iterdir():
            if not p.is_file() or p.suffix=='.error':continue
            for line in p.read_text(errors='replace').splitlines():
              if key.search(line):evidence.append({'source':p.name,'line':line[:4000]})
          gh=[];tok=os.environ['GH_TOKEN']
          for q in ['"jp.co.applibot.ghmabgzaxkx"','octocacheevai','"files/octo/pdb/1/102"','"SEVEN\'S CODE" bluestacks','"SEVEN\'S CODE" backup']:
            u='https://api.github.com/search/code?'+urllib.parse.urlencode({'q':q,'per_page':100})
            req=urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'application/vnd.github+json','Authorization':f'Bearer {tok}'})
            try:
              with urllib.request.urlopen(req,timeout=45) as r:o=json.loads(r.read())
              gh += [{'query':q,'repo':x.get('repository',{}).get('full_name'),'path':x.get('path'),'url':x.get('html_url')} for x in o.get('items',[])]
            except Exception as e:gh.append({'query':q,'error':str(e)})
            time.sleep(1)
          summary={'queries':len(qs),'requests':len(inv),'success':sum('bytes' in x for x in inv),'ia_unique_items':len(unique),'evidence_lines':len(evidence),'github_hits':sum('url' in x for x in gh)}
          (O/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));(O/'ia_docs.json').write_text(json.dumps(list(unique.values()),ensure_ascii=False,indent=2));(O/'evidence.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2));(O/'github.json').write_text(json.dumps(gh,ensure_ascii=False,indent=2));(O/'requests.json').write_text(json.dumps(inv,ensure_ascii=False,indent=2));print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sevens-code-snapshot-fast
          path: result/
          retention-days: 14
