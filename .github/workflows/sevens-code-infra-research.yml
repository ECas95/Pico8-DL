name: SEVEN'S CODE deep online search

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sevens-code-infra-research.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Query archives, search engines and communities
        shell: bash
        run: |
          set +e
          mkdir -p result/raw
          python3 - <<'PY'
          import concurrent.futures, json, pathlib, re, urllib.parse, urllib.request

          OUT = pathlib.Path('result')
          RAW = OUT / 'raw'
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) SEVENS-CODE-preservation'

          exact_terms = [
              'octocacheevai',
              'jp.co.applibot.ghmabgzaxkx',
              'octo.abot.sh',
              'seven-scode.appspot.com',
              "SEVEN'S CODE",
              'SEVENS CODE',
              'セブンスコード',
          ]

          search_queries = [
              '"octocacheevai"',
              '"jp.co.applibot.ghmabgzaxkx" backup cache data',
              '"SEVEN\'S CODE" backup cache dump assets',
              '"SEVEN\'S CODE" "Android/data"',
              '"SEVEN\'S CODE" "Google Drive" OR MEGA OR MediaFire',
              '"SEVEN\'S CODE" 百度网盘 OR 夸克网盘 OR 阿里云盘',
              '"SEVEN\'S CODE" 数据包 OR 资源包 OR 全曲',
              'セブンスコード バックアップ キャッシュ データ',
              'セブンスコード サービス終了 保存 端末',
              'SEVENS CODE private server preservation assets',
              'SEVENS CODE Sonolus simulator chart data',
          ]

          urls = {}
          def add(name, url):
              urls[name] = url

          # Internet Archive metadata search.
          for i, term in enumerate(exact_terms):
              params = urllib.parse.urlencode({
                  'q': f'"{term}"',
                  'fl[]': 'identifier,title,description,subject,mediatype,collection',
                  'rows': 200,
                  'page': 1,
                  'output': 'json',
              })
              add(f'ia_{i}.json', 'https://archive.org/advancedsearch.php?' + params)

          # Search engines and file-share discovery.
          for i, q in enumerate(search_queries):
              enc = urllib.parse.quote_plus(q)
              add(f'ddg_{i}.html', f'https://html.duckduckgo.com/html/?q={enc}')
              add(f'bing_{i}.xml', f'https://www.bing.com/search?format=rss&q={enc}')
              add(f'jina_google_{i}.txt', f'https://r.jina.ai/http://www.google.com/search?q={enc}')

          # Community search APIs.
          for i, q in enumerate(["SEVEN'S CODE", 'SEVENS CODE', 'セブンスコード']):
              enc = urllib.parse.quote(q)
              add(f'reddit_{i}.json', f'https://www.reddit.com/search.json?q={enc}&limit=100&sort=relevance')
              add(f'niconico_{i}.json', 'https://snapshot.search.nicovideo.jp/api/v2/snapshot/video/contents/search?'
                  + urllib.parse.urlencode({'q': q, 'targets': 'title,description,tags', '_sort': '-startTime', '_limit': 100}))
              add(f'bilibili_{i}.json', 'https://api.bilibili.com/x/web-interface/search/type?'
                  + urllib.parse.urlencode({'search_type': 'video', 'keyword': q, 'page': 1}))

          # Wayback and Common Crawl URL-level searches.
          cdx_patterns = [
              'octo.abot.sh/*',
              'seven-scode.firebaseio.com/*',
              'storage.googleapis.com/seven-scode.appspot.com/*',
              'www.sevenscode.jp/*',
              'sevenscode.jp/*',
          ]
          for i, pat in enumerate(cdx_patterns):
              add(f'cdx_{i}.json', 'https://web.archive.org/cdx/search/cdx?' + urllib.parse.urlencode({
                  'url': pat, 'output': 'json',
                  'fl': 'timestamp,original,statuscode,mimetype,digest,length',
                  'filter': 'statuscode:200', 'collapse': 'urlkey',
              }))

          for crawl in ['CC-MAIN-2020-50','CC-MAIN-2021-49','CC-MAIN-2022-49','CC-MAIN-2023-50','CC-MAIN-2024-51']:
              for i, pat in enumerate(cdx_patterns[:4]):
                  add(f'cc_{crawl}_{i}.json', f'https://index.commoncrawl.org/{crawl}-index?'
                      + urllib.parse.urlencode({'url': pat, 'output': 'json'}))

          def fetch(item):
              name, url = item
              req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept': '*/*'})
              try:
                  with urllib.request.urlopen(req, timeout=70) as r:
                      data = r.read()
                      (RAW / name).write_bytes(data)
                      return {'name': name, 'url': url, 'status': getattr(r, 'status', 200),
                              'content_type': r.headers.get('content-type'), 'bytes': len(data)}
              except Exception as exc:
                  (RAW / (name + '.error')).write_text(str(exc), encoding='utf-8')
                  return {'name': name, 'url': url, 'error': str(exc)}

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              inventory = list(ex.map(fetch, urls.items()))
          (OUT / 'inventory.json').write_text(json.dumps(inventory, ensure_ascii=False, indent=2), encoding='utf-8')

          # Parse all downloaded text for candidate links and exact evidence.
          link_re = re.compile(r'https?://[^\s"\'<>\\]+', re.I)
          candidates = set()
          evidence = []
          hosts_of_interest = ('archive.org','drive.google.com','docs.google.com','mega.nz','mediafire.com',
                               'pan.baidu.com','cloud.189.cn','lanzou','aliyundrive','alipan.com','123pan.com',
                               'bilibili.com','reddit.com','nicovideo.jp','github.com','discord.gg','t.me')
          keywords = ('octocacheevai','jp.co.applibot.ghmabgzaxkx','seven\'s code','sevens code',
                      'セブンスコード','files/octo','android/data')
          for p in RAW.iterdir():
              if not p.is_file() or p.name.endswith('.error'):
                  continue
              text = p.read_text(errors='replace')
              low = text.lower()
              if any(k.lower() in low for k in keywords):
                  for line in text.splitlines():
                      ll = line.lower()
                      if any(k.lower() in ll for k in keywords):
                          evidence.append({'source': p.name, 'line': line[:2000]})
              for u in link_re.findall(text):
                  ul = u.lower().rstrip(').,]')
                  if any(h in ul for h in hosts_of_interest):
                      candidates.add(u.rstrip(').,]'))

          (OUT / 'candidate_links.txt').write_text('\n'.join(sorted(candidates)), encoding='utf-8')
          (OUT / 'evidence.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2), encoding='utf-8')

          # Summarize Internet Archive results separately.
          ia_docs = []
          for p in RAW.glob('ia_*.json'):
              try:
                  data = json.loads(p.read_text(errors='replace'))
                  for d in data.get('response', {}).get('docs', []):
                      d['_source'] = p.name
                      ia_docs.append(d)
              except Exception:
                  pass
          (OUT / 'internet_archive_matches.json').write_text(json.dumps(ia_docs, ensure_ascii=False, indent=2), encoding='utf-8')

          summary = {
              'requests': len(inventory),
              'successful': sum(1 for x in inventory if 'status' in x),
              'candidate_links': len(candidates),
              'evidence_lines': len(evidence),
              'internet_archive_documents': len(ia_docs),
          }
          (OUT / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sevens-code-deep-online-search
          path: result/
          if-no-files-found: error
          retention-days: 7
