name: SEVEN'S CODE App Store lookup

on:
  push:
    branches:
      - sevens-code-lookup
    paths:
      - .github/workflows/sevens-code-lookup.yml

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sevens-code-lookup

      - name: Query historical sources
        shell: bash
        run: |
          set +e
          mkdir -p sevens-code-results/raw

          fetch() {
            name="$1"
            url="$2"
            echo "===== $name =====" | tee -a sevens-code-results/request-log.txt
            echo "$url" | tee -a sevens-code-results/request-log.txt
            curl -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125 Safari/537.36' \
              -L --compressed --connect-timeout 20 --max-time 90 \
              -sS "$url" -o "sevens-code-results/raw/$name" 2>>sevens-code-results/request-errors.txt
            printf 'HTTP/bytes: ' >> sevens-code-results/request-log.txt
            wc -c < "sevens-code-results/raw/$name" 2>/dev/null >> sevens-code-results/request-log.txt
          }

          # Apple Search API. Removed apps may not be returned, but this verifies the current catalog.
          fetch apple_en.json 'https://itunes.apple.com/search?term=SEVEN%27S%20CODE&country=jp&entity=software&limit=200'
          fetch apple_en_plain.json 'https://itunes.apple.com/search?term=SEVENS%20CODE&country=jp&entity=software&limit=200'
          fetch apple_ja.json 'https://itunes.apple.com/search?term=%E3%82%BB%E3%83%96%E3%83%B3%E3%82%B9%E3%82%B3%E3%83%BC%E3%83%89&country=jp&entity=software&limit=200'
          fetch apple_applibot.json 'https://itunes.apple.com/search?term=Applibot&country=jp&entity=software&limit=200'

          # Search result mirrors/proxies. These are saved verbatim for later inspection.
          fetch ddg_en.html 'https://html.duckduckgo.com/html/?q=%22SEVEN%27S+CODE%22+%22apps.apple.com%22'
          fetch ddg_ja.html 'https://html.duckduckgo.com/html/?q=%22%E3%82%BB%E3%83%96%E3%83%B3%E3%82%B9%E3%82%B3%E3%83%BC%E3%83%89%22+%22apps.apple.com%22'
          fetch bing_en.xml 'https://www.bing.com/search?format=rss&q=%22SEVEN%27S%20CODE%22%20%22apps.apple.com%22'
          fetch bing_ja.xml 'https://www.bing.com/search?format=rss&q=%22%E3%82%BB%E3%83%96%E3%83%B3%E3%82%B9%E3%82%B3%E3%83%BC%E3%83%89%22%20%22apps.apple.com%22'
          fetch jina_google_en.txt 'https://r.jina.ai/http://www.google.com/search?q=%22SEVEN%27S%20CODE%22+%22apps.apple.com%22'
          fetch jina_google_ja.txt 'https://r.jina.ai/http://www.google.com/search?q=%22%E3%82%BB%E3%83%96%E3%83%B3%E3%82%B9%E3%82%B3%E3%83%BC%E3%83%89%22+%22apps.apple.com%22'
          fetch jina_bing_en.txt 'https://r.jina.ai/http://www.bing.com/search?q=%22SEVEN%27S%20CODE%22+%22apps.apple.com%22'

          # Wayback URL indexes for likely App Store URL slugs and the suspected official domain.
          fetch wayback_apps_sevens.json 'https://web.archive.org/cdx/search/cdx?url=apps.apple.com/jp/app/*sevens*code*/id*&output=json&fl=timestamp,original,statuscode,mimetype,digest&filter=statuscode:200&collapse=urlkey'
          fetch wayback_itunes_sevens.json 'https://web.archive.org/cdx/search/cdx?url=itunes.apple.com/jp/app/*sevens*code*/id*&output=json&fl=timestamp,original,statuscode,mimetype,digest&filter=statuscode:200&collapse=urlkey'
          fetch wayback_official_domain.json 'https://web.archive.org/cdx/search/cdx?url=sevenscode.jp/*&output=json&fl=timestamp,original,statuscode,mimetype,digest&filter=statuscode:200&collapse=urlkey'
          fetch wayback_applibot.json 'https://web.archive.org/cdx/search/cdx?url=www.applibot.co.jp/*seven*code*&output=json&fl=timestamp,original,statuscode,mimetype,digest&filter=statuscode:200&collapse=urlkey'

          # Common Crawl historical URL indexes.
          fetch cc_2020_apps.json 'https://index.commoncrawl.org/CC-MAIN-2020-50-index?url=apps.apple.com/jp/app/*sevens*code*&output=json'
          fetch cc_2021_apps.json 'https://index.commoncrawl.org/CC-MAIN-2021-49-index?url=apps.apple.com/jp/app/*sevens*code*&output=json'
          fetch cc_2022_apps.json 'https://index.commoncrawl.org/CC-MAIN-2022-49-index?url=apps.apple.com/jp/app/*sevens*code*&output=json'
          fetch cc_2020_itunes.json 'https://index.commoncrawl.org/CC-MAIN-2020-50-index?url=itunes.apple.com/jp/app/*sevens*code*&output=json'

          # Extract candidate Apple numeric IDs and URLs from every response.
          grep -RhaoE 'https?://([^"<> ]*\.)?(apps|itunes)\.apple\.com/[^"<> ]+' sevens-code-results/raw \
            | sed 's/&amp;/\&/g' | sort -u > sevens-code-results/apple-urls.txt
          grep -RhaoE '(^|[^0-9])(id)?[0-9]{8,12}([^0-9]|$)' sevens-code-results/raw \
            | grep -oE '[0-9]{8,12}' | sort -u > sevens-code-results/numeric-id-candidates.txt
          grep -RhaiE -C 3 "SEVEN.?S.?CODE|SEVENS.?CODE|セブンスコード|Applibot|アプリボット" sevens-code-results/raw \
            > sevens-code-results/relevant-lines.txt

          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('sevens-code-results')
          rows=[]
          for p in (root/'raw').glob('apple*.json'):
              try:
                  data=json.loads(p.read_text(errors='replace'))
              except Exception:
                  continue
              for r in data.get('results',[]):
                  text=' '.join(str(r.get(k,'')) for k in ('trackName','artistName','bundleId','trackViewUrl'))
                  if re.search(r"seven.?s.?code|sevens.?code|セブンスコード|applibot", text, re.I):
                      rows.append({
                          'source':p.name,
                          'trackId':r.get('trackId'),
                          'trackName':r.get('trackName'),
                          'bundleId':r.get('bundleId'),
                          'artistName':r.get('artistName'),
                          'version':r.get('version'),
                          'trackViewUrl':r.get('trackViewUrl'),
                      })
          (root/'apple-matches.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          PY

      - name: Commit lookup results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sevens-code-results
          git commit -m "Save SEVEN'S CODE App Store lookup results" || exit 0
          git push origin HEAD:sevens-code-lookup
