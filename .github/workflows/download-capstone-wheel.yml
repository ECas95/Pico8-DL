name: Download Capstone wheel

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/download-capstone-wheel.yml

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux wheel
        run: |
          mkdir wheels
          python3 -m pip download --only-binary=:all: --no-deps capstone -d wheels
          ls -lah wheels
      - uses: actions/upload-artifact@v4
        with:
          name: capstone-wheel
          path: wheels/
          retention-days: 7
