name: Run 4PDA backup search

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/search-4pda-backups-pr.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Query 4PDA and external indexes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4 lxml cloudscraper
          mkdir -p result/raw
          python3 - <<'PY'
          import csv, hashlib, html, json, pathlib, re, time, urllib.parse
          import requests
          from bs4 import BeautifulSoup
          import cloudscraper

          OUT=pathlib.Path('result'); RAW=OUT/'raw'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
          terms=[
            "SEVEN'S CODE","SEVENS CODE","Seven Code","セブンスコード",
            'jp.co.applibot.ghmabgzaxkx','octocacheevai','octo.abot.sh','files/octo','octo/pdb/1/102','trdhaul6gig46gt4',
            'резервная копия Nox','бэкап Nox','образ Nox','npbk',
            'резервная копия LDPlayer','бэкап LDPlayer','ldbk',
            'образ BlueStacks','резервная копия BlueStacks','Data.vhdx BlueStacks',
            'бэкап MEmu','образ MEmu','экспорт эмулятора Android','userdata-qemu.img','vmdk Android emulator game',
            'полный кэш игры','кэш игры с сервера','данные после установки игры','скачанные данные игры',
            'полный бэкап приложения с данными','Titanium Backup игра данные','Android data игра архив','Android obb игра архив',
            'дамп данных мобильной игры','все ресурсы игры','закрытая мобильная игра архив','сервер игры закрыт данные',
            'игра после закрытия сервера','офлайн версия мобильной игры','частный сервер мобильной игры',
            'мобильная ритм игра','музыкальная игра Android','японская ритм игра Android',
            'бэкап музыкальной игры','кэш ритм игры','ресурсы музыкальной игры','закрытая ритм игра'
          ]
          exact=['jp.co.applibot.ghmabgzaxkx','octocacheevai','octo.abot.sh','files/octo','octo/pdb/1/102','trdhaul6gig46gt4',"seven's code",'sevens code','セブンスコード']
          mirrors=['mega.nz','drive.google.com','disk.yandex','yadi.sk','cloud.mail.ru','mediafire.com','pan.baidu.com','123pan','123865.com','t.me/','magnet:?','/forum/dl/post/']

          s=cloudscraper.create_scraper(browser={'browser':'chrome','platform':'windows','desktop':True})
          s.headers.update({'User-Agent':UA,'Accept-Language':'ru-RU,ru;q=0.9,en;q=0.6'})
          logs=[]; links=[]; internal=[]; engine=[]
          def enc(t):
            try:return urllib.parse.quote_from_bytes(t.encode('cp1251'))
            except:return urllib.parse.quote(t,safe='')
          def dec(r):
            for e in ['windows-1251','cp1251','utf-8']:
              try:
                x=r.content.decode(e)
                if '�' not in x[:2000]: return x
              except: pass
            return r.content.decode('utf-8','replace')
          def save(prefix,key,text):
            n=hashlib.sha1(key.encode('utf-8')).hexdigest()[:14]
            p=RAW/f'{prefix}_{n}.html'; p.write_text(text,encoding='utf-8',errors='replace'); return str(p)
          for u in ['https://4pda.to/forum/','https://4pda.ru/forum/']:
            try:
              r=s.get(u,timeout=35); logs.append({'type':'seed','url':u,'status':r.status_code,'bytes':len(r.content),'final':r.url})
            except Exception as e: logs.append({'type':'seed','url':u,'error':repr(e)})

          for ti,t in enumerate(terms):
            for host in ['4pda.to','4pda.ru']:
              for result,source,sort in [('posts','all','dd'),('topics','top','rel')]:
                u=f'https://{host}/forum/index.php?act=search&result={result}&sort={sort}&source={source}&query={enc(t)}&subforums=1&noform=1&st=0&exclude_trash=1'
                try:
                  r=s.get(u,headers={'Referer':f'https://{host}/forum/'},timeout=45,allow_redirects=True); text=dec(r)
                  blocked=bool(re.search(r'403 Forbidden|Access denied|Cloudflare|Доступ ограничен|captcha',text,re.I))
                  found=set(re.findall(r'https?://4pda\.(?:to|ru)/forum/[^\s\"\'<>]+',html.unescape(text),re.I))
                  soup=BeautifulSoup(text,'lxml')
                  for a in soup.find_all('a',href=True):
                    h=urllib.parse.urljoin(r.url,html.unescape(a['href']))
                    if '4pda.' in h and ('showtopic=' in h or 'view=findpost' in h):found.add(h)
                  for h in found:links.append({'source':'internal','query':t,'url':h})
                  internal.append({'term':t,'host':host,'result':result,'source':source,'status':r.status_code,'bytes':len(r.content),'blocked':blocked,'links':len(found),'final':r.url,'file':save(f'int_{ti}_{host}_{result}',t+host+result,text)})
                  logs.append({'type':'internal','query':t,'url':u,'status':r.status_code,'bytes':len(r.content),'blocked':blocked,'links':len(found)})
                except Exception as e:
                  internal.append({'term':t,'host':host,'result':result,'source':source,'error':repr(e)}); logs.append({'type':'internal','query':t,'url':u,'error':repr(e)})
                time.sleep(.12)

          templates={
            'bing':'https://www.bing.com/search?format=rss&q={}',
            'brave':'https://search.brave.com/search?q={}&source=web',
            'mojeek':'https://www.mojeek.com/search?q={}',
            'google_jina':'https://r.jina.ai/http://www.google.com/search?q={}',
            'bing_jina':'https://r.jina.ai/http://www.bing.com/search?q={}',
            'yandex':'https://yandex.com/search/?text={}'
          }
          queries=[]
          for t in terms:queries += [f'site:4pda.to/forum "{t}"',f'site:4pda.ru/forum "{t}"']
          queries += ['site:4pda.to/forum Nox резервное копирование восстановление','site:4pda.to/forum LDPlayer резервное копирование восстановление','site:4pda.to/forum BlueStacks данные игры бэкап','site:4pda.to/forum MEmu экспорт импорт образ','site:4pda.to/forum музыкальные игры Android кэш','site:4pda.to/forum закрытые мобильные игры данные сервера']
          for qi,q in enumerate(dict.fromkeys(queries)):
            for name,tpl in templates.items():
              u=tpl.format(urllib.parse.quote_plus(q))
              try:
                r=s.get(u,timeout=45,allow_redirects=True); text=dec(r); found=set()
                for x in re.findall(r'https?://[^\s\"\'<>\]\)]+',html.unescape(text),re.I):
                  x=urllib.parse.unquote(x)
                  m=re.search(r'https?://4pda\.(?:to|ru)/forum/[^\s\"\'<>\]\)]+',x,re.I)
                  if m:found.add(m.group(0).rstrip('.,;:&'))
                soup=BeautifulSoup(text,'lxml')
                for a in soup.find_all('a',href=True):
                  h=urllib.parse.unquote(html.unescape(a['href']))
                  if '4pda.to/forum' in h or '4pda.ru/forum' in h:found.add(h)
                for h in found:links.append({'source':name,'query':q,'url':h})
                engine.append({'query':q,'engine':name,'status':r.status_code,'bytes':len(r.content),'links':len(found),'final':r.url,'file':save(f'eng_{qi}_{name}',q+name,text)})
                logs.append({'type':'engine','query':q,'engine':name,'status':r.status_code,'bytes':len(r.content),'links':len(found)})
              except Exception as e:engine.append({'query':q,'engine':name,'error':repr(e)});logs.append({'type':'engine','query':q,'engine':name,'error':repr(e)})
              time.sleep(.08)

          ded=[]; seen=set(); tids=set()
          for x in links:
            u=urllib.parse.unquote(html.unescape(x['url']))
            k=(x['source'],x['query'],u)
            if k in seen:continue
            seen.add(k); m=re.search(r'(?:showtopic=|[?&]t=)(\d+)',u); pid=re.search(r'(?:showpost=|[?&]p=)(\d+)',u)
            x={'source':x['source'],'query':x['query'],'url':u,'topic_id':m.group(1) if m else '','post_id':pid.group(1) if pid else ''}; ded.append(x)
            if m:tids.add(m.group(1))

          topics=[]; ext=[]; atts=[]
          for tid in sorted(tids,key=int):
            eps=[f'https://4pda.to/forum/lofiversion/index.php?t={tid}',f'https://4pda.ru/forum/lofiversion/index.php?t={tid}',f'https://4pda.to/forum/index.php?act=Print&client=printer&f=0&t={tid}',f'https://4pda.to/forum/index.php?showtopic={tid}']
            best=''; besturl=''; statuses=[]
            for u in eps:
              try:
                r=s.get(u,timeout=45,allow_redirects=True); text=dec(r); statuses.append(f'{r.status_code}:{len(r.content)}')
                if r.status_code==200 and len(text)>len(best) and not re.search(r'403 Forbidden|Access denied|Cloudflare|captcha',text,re.I):best=text;besturl=r.url
              except Exception as e:statuses.append('ERR')
              time.sleep(.1)
            if not best:topics.append({'topic_id':tid,'accessible':False,'statuses':'|'.join(statuses)});continue
            soup=BeautifulSoup(best,'lxml'); title=soup.title.get_text(' ',strip=True) if soup.title else ''; txt=soup.get_text(' ',strip=True); low=txt.lower(); hits=[k for k in exact if k in low]
            general=[k for k in ['резервная копия','бэкап','полный кэш','данные игры','ритм','музыкаль','npbk','ldbk','data.vhdx','userdata-qemu.img'] if k in low]
            score=len(hits)*10+len(general)
            urls=set(urllib.parse.urljoin(besturl,html.unescape(a['href'])) for a in soup.find_all('a',href=True));urls.update(re.findall(r'https?://[^\s\"\'<>\]\)]+',best,re.I))
            for u in urls:
              if '/forum/dl/post/' in u:atts.append({'topic_id':tid,'title':title,'url':u})
              elif any(h in u.lower() for h in mirrors):ext.append({'topic_id':tid,'title':title,'source':besturl,'url':u})
            topics.append({'topic_id':tid,'accessible':True,'url':besturl,'title':title,'chars':len(txt),'score':score,'exact_hits':' | '.join(hits),'general_hits':' | '.join(general),'statuses':'|'.join(statuses)})

          def uniq(rows,ks):
            o=[];s0=set()
            for r in rows:
              k=tuple(r.get(x,'') for x in ks)
              if k not in s0:s0.add(k);o.append(r)
            return o
          ext=uniq(ext,['topic_id','url']);atts=uniq(atts,['topic_id','url'])
          def wcsv(n,rows):
            fields=sorted({k for r in rows for k in r}) if rows else ['empty']
            with (OUT/n).open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore');w.writeheader();w.writerows(rows)
          wcsv('internal.csv',internal);wcsv('engines.csv',engine);wcsv('links.csv',ded);wcsv('topics.csv',sorted(topics,key=lambda x:-int(x.get('score',0) or 0)));wcsv('attachments.csv',atts);wcsv('mirrors.csv',ext)
          summary={'terms':len(terms),'internal_requests':sum(x.get('type')=='internal' for x in logs),'internal_200':sum(x.get('type')=='internal' and x.get('status')==200 for x in logs),'internal_blocked':sum(x.get('type')=='internal' and x.get('blocked') for x in logs),'engine_requests':sum(x.get('type')=='engine' for x in logs),'engine_200':sum(x.get('type')=='engine' and x.get('status')==200 for x in logs),'links':len(ded),'topic_ids':len(tids),'accessible_topics':sum(bool(x.get('accessible')) for x in topics),'attachments':len(atts),'mirrors':len(ext),'exact_topics':[x for x in topics if x.get('exact_hits')]}
          (OUT/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8');(OUT/'request_log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          md=['# 4PDA search report','']+[f'- {k}: {v}' for k,v in summary.items() if k!='exact_topics']+['','## Exact target topics','']
          if summary['exact_topics']:
            md += [f"- {x.get('title')} — {x.get('url')} — {x.get('exact_hits')}" for x in summary['exact_topics']]
          else:md+=['No topic contained the exact package, Octo path, cache name, key or title variants.']
          md+=['','## Highest scoring topics','']+[f"- Score {x.get('score',0)} — {x.get('title','')} — {x.get('url','')} — {x.get('general_hits','')}" for x in sorted([x for x in topics if x.get('accessible')],key=lambda x:-int(x.get('score',0) or 0))[:50]]
          (OUT/'README.md').write_text('\n'.join(md),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 4pda-search-results
          path: result/
          if-no-files-found: error
          retention-days: 14
