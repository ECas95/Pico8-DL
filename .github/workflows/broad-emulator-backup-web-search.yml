name: Broad emulator backup web search

on:
  push:
    branches:
      - sevens-code-lookup
    paths:
      - .github/workflows/broad-emulator-backup-web-search.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/broad-emulator-backup-web-search.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Search FTP indexes forums torrents and repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result/raw
          python3 - <<'PY'
          import concurrent.futures, html, json, os, pathlib, re, time, urllib.parse, urllib.request

          OUT=pathlib.Path('result'); RAW=OUT/'raw'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) mobile-game-preservation-research'

          formats=['npbk','ldbk','vmdk','vhdx','vdi','ova','ovf','qcow2','tib','ab']
          base_terms=[
            'Nox backup game','LDPlayer backup game','BlueStacks backup game','MEmu backup game','MuMu backup game',
            'android emulator snapshot games','mobile game server files backup','mobile game end of service backup',
            'rhythm game backup android','music game backup android','rhythm game data files',
            'android game data backup emulator','downloaded server files android game'
          ]
          multilingual=[
            '手游 模拟器 备份 数据包','音游 模拟器 备份','停服 手游 数据 备份','夜神模拟器 游戏 备份',
            '雷电模拟器 游戏 备份','MuMu模拟器 游戏 备份','安卓 游戏 数据包 全量',
            '音ゲー エミュレータ バックアップ','スマホゲーム サービス終了 データ 保存',
            'Android ゲーム データ バックアップ エミュレータ',
            'мобильная игра эмулятор резервная копия Nox','архив данных мобильной игры закрытие сервера'
          ]
          directory_queries=[]
          for ext in formats:
            directory_queries += [
              f'intitle:"index of" .{ext}', f'"Index of /" .{ext} game', f'ftp .{ext} android',
              f'site:drive.google.com .{ext}', f'site:mega.nz .{ext}', f'site:mediafire.com .{ext}',
              f'site:pan.baidu.com .{ext}', f'site:123pan.com .{ext}', f'site:alipan.com .{ext}',
              f'site:yadi.sk .{ext}', f'site:disk.yandex.com .{ext}'
            ]
          forum_queries=[]
          forum_domains=['4pda.to','4pda.ru','xdaforums.com','gbatemp.net','cs.rin.ru','mobilism.org','reddit.com','tieba.baidu.com','52pojie.cn','bbs.nga.cn','gamer.com.tw','forum.xda-developers.com']
          for d in forum_domains:
            forum_queries += [f'site:{d} Nox backup game',f'site:{d} LDPlayer backup game',f'site:{d} mobile game preservation',f'site:{d} rhythm game backup']
          queries=list(dict.fromkeys(base_terms+multilingual+directory_queries+forum_queries))

          engines={}
          for i,q in enumerate(queries):
            enc=urllib.parse.quote_plus(q)
            engines[f'bing_{i:03d}.xml']=f'https://www.bing.com/search?format=rss&q={enc}'
            engines[f'mojeek_{i:03d}.html']=f'https://www.mojeek.com/search?q={enc}'
            engines[f'brave_{i:03d}.html']=f'https://search.brave.com/search?q={enc}&source=web'
            if i<90:
              engines[f'yahoo_{i:03d}.html']=f'https://search.yahoo.com/search?p={enc}'

          direct_queries=['npbk','ldbk','Nox backup game','LDPlayer backup game','rhythm game backup','music game data files','mobile game server files']
          for i,q in enumerate(direct_queries):
            enc=urllib.parse.quote_plus(q)
            engines[f'reddit_{i}.json']=f'https://www.reddit.com/search.json?q={enc}&limit=100&sort=relevance'
            engines[f'btdig_{i}.html']=f'https://btdig.com/search?q={enc}'
            engines[f'bt4g_{i}.html']=f'https://bt4gprx.com/search/{urllib.parse.quote(q)}'
            engines[f'nyaa_{i}.html']=f'https://nyaa.si/?f=0&c=0_0&q={enc}'
            engines[f'sourceforge_{i}.html']=f'https://sourceforge.net/directory/?q={enc}'
            engines[f'bilibili_{i}.json']='https://api.bilibili.com/x/web-interface/search/type?'+urllib.parse.urlencode({'search_type':'video','keyword':q,'page':1})
            engines[f'niconico_{i}.json']='https://snapshot.search.nicovideo.jp/api/v2/snapshot/video/contents/search?'+urllib.parse.urlencode({'q':q,'targets':'title,description,tags','_sort':'-startTime','_limit':100})
            engines[f'zenodo_{i}.json']='https://zenodo.org/api/records?size=100&q='+urllib.parse.quote(q)
            engines[f'hf_ds_{i}.json']='https://huggingface.co/api/datasets?limit=100&search='+urllib.parse.quote(q)
            engines[f'hf_models_{i}.json']='https://huggingface.co/api/models?limit=100&search='+urllib.parse.quote(q)
            engines[f'filepursuit_{i}.html']=f'https://filepursuit.com/pursuit?q={enc}&type=all'
            engines[f'filesearch_{i}.html']=f'https://filesearch.link/search?q={enc}'
            engines[f'ftpsearcher_{i}.html']=f'https://www.ftpsearcher.com/search?q={enc}'
            engines[f'mmnt_{i}.html']=f'https://mmnt.ru/int/get?st={enc}'

          def fetch(item):
            name,url=item
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*','Accept-Language':'en-US,en;q=0.8'})
            try:
              with urllib.request.urlopen(req,timeout=45) as r:
                data=r.read(4_000_000)
                (RAW/name).write_bytes(data)
                return {'name':name,'url':url,'status':getattr(r,'status',200),'content_type':r.headers.get('content-type'),'bytes':len(data),'final_url':r.geturl()}
            except Exception as exc:
              (RAW/(name+'.error')).write_text(str(exc),encoding='utf-8')
              return {'name':name,'url':url,'error':str(exc)}

          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
            inventory=list(ex.map(fetch,engines.items()))
          (OUT/'request_inventory.json').write_text(json.dumps(inventory,ensure_ascii=False,indent=2),encoding='utf-8')

          token=os.environ.get('GH_TOKEN','')
          gh=[]
          gh_queries=['npbk','ldbk','"Nox backup" game','"LDPlayer backup" game','"mobile game preservation" android','"rhythm game" assets backup','"server files" android game']
          for scope in ['code','repositories']:
            for q in gh_queries:
              url=f'https://api.github.com/search/{scope}?'+urllib.parse.urlencode({'q':q,'per_page':100})
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}'})
              try:
                with urllib.request.urlopen(req,timeout=60) as r: obj=json.loads(r.read())
                for x in obj.get('items',[]):
                  gh.append({'scope':scope,'query':q,'name':x.get('name') or x.get('full_name'),'path':x.get('path'),'url':x.get('html_url'),'repo':x.get('repository',{}).get('full_name')})
              except Exception as exc: gh.append({'scope':scope,'query':q,'error':str(exc)})
              time.sleep(1)
          (OUT/'github_results.json').write_text(json.dumps(gh,ensure_ascii=False,indent=2),encoding='utf-8')

          url_re=re.compile(r'(?:https?|ftp)://[^\s"\'<>\\]+',re.I)
          key_re=re.compile(r'(?i)(\.npbk|\.ldbk|\.vmdk|\.vhdx|\.vdi|\.ova|\.ovf|\.qcow2|nox.{0,20}backup|ldplayer.{0,20}backup|bluestacks.{0,20}backup|memu.{0,20}backup|mumu.{0,20}backup|server.{0,20}(files|download)|android.{0,20}data files|rhythm.{0,20}(backup|data|assets)|music game.{0,20}(backup|data|assets)|end of service|shutdown.{0,20}backup|停服|音游|音ゲー)')
          interesting_hosts=('ftp','drive.google.com','mega.nz','mediafire.com','pan.baidu.com','123pan.com','alipan.com','aliyundrive.com','lanzou','yadi.sk','disk.yandex','archive.org','github.com','gitlab.com','huggingface.co','zenodo.org','reddit.com','4pda','xdaforums','gbatemp','cs.rin.ru','mobilism','tieba.baidu','52pojie','nga.cn','gamer.com.tw','btdig','bt4g','nyaa.si','sourceforge')
          lines=[]; links=set()
          for p in RAW.iterdir():
            if not p.is_file() or p.name.endswith('.error'): continue
            text=html.unescape(p.read_text(errors='replace'))
            for line in text.splitlines():
              if key_re.search(line): lines.append({'source':p.name,'line':line[:6000]})
            for u in url_re.findall(text):
              u=u.rstrip(').,];&')
              if key_re.search(u) or any(h in u.lower() for h in interesting_hosts): links.add(u)
          for x in gh:
            if x.get('url'): links.add(x['url'])
          (OUT/'evidence_lines.json').write_text(json.dumps(lines,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'candidate_links.txt').write_text('\n'.join(sorted(links)),encoding='utf-8')

          def validate(u):
            try:
              req=urllib.request.Request(u,headers={'User-Agent':UA,'Range':'bytes=0-1023'})
              with urllib.request.urlopen(req,timeout=20) as r:
                return {'url':u,'status':getattr(r,'status',200),'content_type':r.headers.get('content-type'),'content_length':r.headers.get('content-length'),'final_url':r.geturl()}
            except Exception as exc: return {'url':u,'error':str(exc)}
          shortlist=[u for u in sorted(links) if key_re.search(u)][:300]
          with concurrent.futures.ThreadPoolExecutor(max_workers=15) as ex:
            candidates=list(ex.map(validate,shortlist))
          (OUT/'validated_candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')

          summary={'queries':len(queries),'requests':len(inventory),'successful':sum(1 for x in inventory if x.get('status')),'evidence_lines':len(lines),'candidate_links':len(links),'shortlist_validated':len(candidates),'github_hits':sum(1 for x in gh if x.get('url'))}
          (OUT/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: broad-emulator-backup-web-search
          path: result/
          if-no-files-found: error
          retention-days: 14
